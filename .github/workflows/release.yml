name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          TAG_COMMIT="${{ github.sha }}"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::This tag is not on the main branch. Aborting release."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build binaries
        run: bun run build

      - name: Run tests
        run: bun test

      - name: Package binaries
        run: bun run package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/git-kamaji-${{ github.ref_name }}.zip
          generate_release_notes: true
